# DataCollectHub 前端容器 nginx：系统唯一对外入口（架构 5.4/7.1）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退（/batches、/files/:id 等前端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 集成接口不代理：外部不可达（内网隔离第一层，架构 5.4）
    location /api/v1/integration/ {
        return 404;
    }

    # 业务 API 反代后端（最长前缀匹配，先于 /api/ 命中上面的 integration 例外）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康检查
    location = /healthz {
        proxy_pass http://backend:8080/healthz;
    }
}
