# DataCollectHub 三容器编排（架构 7.1）：
#   frontend (nginx:80)     唯一对外入口，反代 /api → backend；/api/v1/integration/ 返回 404（内网隔离）
#   backend  (FastAPI:8080) 不对外发布，仅 front/back 内部网络；SQLite 挂载 ./data
#   minio    (:9000)        9000 发布（浏览器分片直传/presigned 下载，架构 7.1 front 网络语义）；
#                           9001 Console 仅内网（调试需临时映射）
# FDL 引擎以 networks: [back] 接入（docker network connect），直连 backend:8080 集成接口。
services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"   # 服务器部署时 .env 设 FRONTEND_PORT=19001
    networks: [front]
    depends_on:
      - backend

  backend:
    build: ./backend
    expose:
      - "8080"                      # 不对外
    volumes:
      - ./data:/data
    environment:
      DATABASE_URL: "sqlite:////data/datacollecthub.db"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-dev-secret-change-me}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_BUCKET: "energydata-raw"
      # presigned URL 公共端点：浏览器/FDL 可达地址（生产换 HTTPS 反代域名）
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}"
    networks: [front, back]
    depends_on:
      - minio

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"  # 浏览器 presigned 直传/下载（架构 7.1；服务器部署时设 MINIO_PORT=19002 避开宿主机 minio）
    expose:
      - "9001"                      # Console 仅内网
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - minio-data:/data
    networks: [front, back]

networks:
  front: {}
  back: {}                          # FDL 引擎以 networks: [back] 接入

volumes:
  minio-data: {}
